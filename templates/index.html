<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link href="https://cdn.jsdelivr.net/style/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #212529;
        }
        .container {
            max-width: 700px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 10px 24px;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        textarea {
            border-radius: 8px !important;
            resize: none;
        }
        .response-container {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #e9ecef;
        }
    </style>
    <script src="./static/mywebscript.js"></script>
</head>
<body>
    <div class="container">
        <div class="card p-4">
            <h2 class="text-center mb-4 text-primary font-weight-bold">AI Emotion Detector</h2>
            <div class="mb-3">
                <label for="textToAnalyze" class="form-label fw-semibold">Enter statement to analyze:</label>
                <textarea class="form-control" id="textToAnalyze" name="textToAnalyze" rows="4" placeholder="Type or paste your text here..."></textarea>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Analyze Emotion</button>
            </div>
            <div id="system_response" class="response-container text-muted text-center">
                Analysis results will appear here.
            </div>
        </div>
    </div>
</body>
</html>
